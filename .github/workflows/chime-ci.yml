name: chime CI

on:
  push:
    branches: [main]
    paths:
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "chime/**"
      - "common/**"
      - "webui/**"
      - "scripts/**"
      - "buildroot/**"
      - ".github/workflows/chime-ci.yml"
      - ".clang-format"
      - ".clang-tidy"
      - "webui/biome.json"
      - "webui/package.json"
      - "webui/bun.lock"
  pull_request:
    paths:
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "chime/**"
      - "common/**"
      - "webui/**"
      - "scripts/**"
      - "buildroot/**"
      - ".github/workflows/chime-ci.yml"
      - ".clang-format"
      - ".clang-tidy"
      - "webui/biome.json"
      - "webui/package.json"
      - "webui/bun.lock"
  workflow_dispatch:

concurrency:
  group: chime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CMake 4.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.0.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: buildroot/bun-version

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libmosquitto-dev \
            libssl-dev \
            clang-format-18 clang-tidy-18 shellcheck rsync

      - name: Install webui deps
        working-directory: webui
        run: |
          bun --version
          expected="$(tr -d '[:space:]' < ../buildroot/bun-version)"
          test "$(bun --version)" = "$expected"
          (cd vendor && sha256sum -c node_modules.tar.gz.sha256)
          bash ../scripts/assert_webui_vendor_archive.sh vendor/node_modules.tar.gz
          tar -xzf vendor/node_modules.tar.gz
          bun install --frozen-lockfile --offline
          bun run build
          bash ../buildroot/board/raspberrypi0w/assert_chime_web_ui_dist.sh dist

      - name: Determine CI file scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_sha}" || true
            fi
            if git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              echo "CHIME_CI_SCOPE=changed" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=${base_sha}" >> "$GITHUB_ENV"
            else
              echo "CHIME_CI_SCOPE=all" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=" >> "$GITHUB_ENV"
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            before_sha="${{ github.event.before }}"
            if git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              echo "CHIME_CI_SCOPE=changed" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=${before_sha}" >> "$GITHUB_ENV"
            else
              echo "CHIME_CI_SCOPE=all" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=" >> "$GITHUB_ENV"
            fi
          else
            echo "CHIME_CI_SCOPE=all" >> "$GITHUB_ENV"
            echo "CHIME_CI_BASE_REF=" >> "$GITHUB_ENV"
          fi

      - name: Run repository lint/format checks
        run: |
          bash ./scripts/lint_format_ci.sh

      - name: Test source synchronization safeguards
        run: |
          bash ./scripts/test_sync_chime_src.sh
          bash ./scripts/test_sync_webui_src.sh
          bash ./scripts/test_vendor_webui_archive.sh

      - name: Test baked web UI image assertions
        run: |
          bash ./scripts/test_assert_chime_web_ui_dist.sh
          bash ./scripts/test_post_build_web_ui.sh

      - name: Run chime CI checks
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          CLANG_FORMAT_TOOL: clang-format-18
          CLANG_TIDY_TOOL: clang-tidy-18
        run: |
          bash ./scripts/chime_ci.sh

      - name: Assert checkout is clean
        run: |
          test -z "$(git status --porcelain)"

  # Cross-compile the chime packages only. This is not docker_build.sh and does
  # not produce sdcard.img (kernel, overlay, genimage).
  buildroot-chime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildroot toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openchime-buildroot
          # Key on the toolchain/defconfig, not package sources. Package edits
          # must reuse gcc rather than spend ~35 minutes bootstrapping it.
          key: buildroot-chime-${{ runner.os }}-2024.02.1-${{ hashFiles('buildroot/configs/**') }}
          restore-keys: |
            buildroot-chime-${{ runner.os }}-2024.02.1-

      - name: Build Buildroot chime package
        env:
          BUILDROOT_WORK_DIR: ${{ runner.temp }}/openchime-buildroot
        run: |
          bash ./scripts/buildroot_chime.sh

      - name: Assert checkout is clean
        run: |
          test -z "$(git status --porcelain)"
