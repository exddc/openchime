metadata:
  title: Ring
  description: Low-voltage Ring harness; four-button population; estimated lengths for 300 x 150 mm casing
  notes: Prototype. Mains adapters remain indoors. U5 buffers button contacts; see button-input.md. Relay selection and antenna clearance await
    enclosure design. Lengths include service slack; external installation cables are excluded.
connectors:
  J8:
    type: Raspberry Pi GPIO
    subtype: male
    ignore_in_bom: true
    notes: Pin 1 is nearest the microSD slot, inner row (square pad on the underside).
    pins: [1, 2, 4, 6, 9, 11, 12, 13, 14, 15, 16, 17, 20, 29, 31, 35, 38, 40]
    pinlabels: [3V3, 5V_RLY, 5V, GND, GND_MIC, BUTTON1, I2S_BCLK, BUTTON2, GND_RLY, BUTTON3, BUTTON4, 3V3_RLY, GND_BTN, RELAY1, RELAY2, I2S_LRCLK,
      I2S_MIC, I2S_DIN]
    hide_disconnected_pins: false
  J_CSI:
    type: Pi Zero CSI
    subtype: 22-pin mini
    ignore_in_bom: true
    notes: Standard-Mini 200 mm ribbon. Contacts face the PCB.
    pins: [1]
    pinlabels: [CSI-2]
  U1:
    type: MAX98357A
    ignore_in_bom: true
    notes: 'Adafruit 3006. VIN-SD: left channel. VIN-GAIN: 6 dB. C1 470 uF and C2 100 nF across VIN/GND. SPK- is not GND.'
    pins: [VIN, GND, SD, GAIN, DIN, BCLK, LRC, SPK+, SPK-]
    hide_disconnected_pins: false
  U2:
    type: SPH0645LM4H
    ignore_in_bom: true
    notes: 3.3 V only. Bottom port faces down. SEL jumpered to GND (left).
    pins: [1, 2, 3, 4, 5, 6]
    pinlabels: [3V, GND, BCLK, DOUT, LRCL, SEL]
    hide_disconnected_pins: false
    loops:
    - [2, 6]
  U3:
    type: 2-ch 5V relay
    ignore_in_bom: true
    notes: Provisional module; E4 deferred. JD-VCC jumper absent. VCC 3.3 V; JD-VCC 5 V after F2. C3 100 uF from JD-VCC to GND. IN LOW energizes
      coil. COM1/NO1 switch isolated 12 V. Logic GND is common with Pi.
    pins: [VCC, GND, IN1, IN2, JD-VCC, COM1, NO1]
    hide_disconnected_pins: false
  BTN:
    type: Button loom
    ignore_in_bom: true
    notes: Four switch contacts plus common return. Populate positions 1-n. Each contact closes SWn to RETURN; field wires terminate at U5, not
      at GPIO.
    pins: [1, 2, 3, 4, 5]
    pinlabels: [SW1, SW2, SW3, SW4, RETURN]
  SP1:
    type: Speaker
    ignore_in_bom: true
    notes: Adafruit 3351 enclosed 3 W 4 Ω. Amplifier + to speaker +. JST-PH 2.0 cable into 3006 screw terminals. Keep under 10 cm.
    pins: [SPK+, SPK-]
    pinlabels: [SPK+, SPK-]
  CAM1:
    type: Camera Module 3
    ignore_in_bom: true
    notes: IMX708. 15-pin camera end of the Standard-Mini cable.
    pins: [1]
    pinlabels: [CSI-2]
  F1:
    type: 1 A fuse
    ignore_in_bom: true
    notes: In the 12 V+ lead to RELAY1 COM1.
    pins: [1, 2]
    pinlabels: [IN, OUT]
  J12:
    type: 12 V inlet
    ignore_in_bom: true
    pins: [12V, RTN]
    notes: From indoor GST18E12-P1J adapter via installation cable. Terminal names; connector part pending. Return is separate from Pi GND.
  JOUT:
    type: Strike outlet
    ignore_in_bom: true
    pins: [STRIKE+, STRIKE-]
    notes: 'To external effeff A7 strike. D1 1N4007 at coil: cathode STRIKE+, anode STRIKE-. External cable length is installation-specific.'
  F2:
    type: 500 mA hold PTC
    ignore_in_bom: true
    pins: [IN, OUT]
    notes: In series with relay JD-VCC; C3 is downstream.
  U5:
    type: Button interface
    ignore_in_bom: true
    pins: [3V3, 5V, GND, GPIO1, GPIO2, GPIO3, GPIO4, RLY1, RLY2, SW1, SW2, SW3, SW4, RETURN]
    notes: Custom circuit in button-input.md. Buffered active-low outputs; six 10k pull-ups. RETURN and GND joined on board. Shared ground; no
      system galvanic isolation. Connector layout pending.
