metadata:
  title: Ring buttons, relays, and sensor
  description: Button interface, relay logic, heater control, and the environment sensor; four-button population
  notes: Prototype. U5 buffers the button contacts; see button-input.md. Field wires terminate at U5, never at a GPIO. Relay coil supply and heater power are in wiring-power.
connectors:
  J8:
    type: Raspberry Pi GPIO
    subtype: male
    ignore_in_bom: true
    notes: Zero 2 W. Pin 1 is nearest the microSD slot, inner row (square pad on the underside). Pin 1 also feeds U2; see wiring-audio.
    pins: [1, 3, 5, 11, 13, 15, 16, 17, 18, 20, 25, 29, 31]
    pinlabels: [3V3, I2C_SDA, I2C_SCL, BUTTON1, BUTTON2, BUTTON3, BUTTON4, 3V3_RLY, HEATER, GND_BTN, GND_ENV, RELAY1, RELAY2]
    hide_disconnected_pins: false
  U5:
    type: Ring I/O board
    ignore_in_bom: true
    notes: Custom circuit in button-input.md. Buffered active-low outputs; six 10k pull-ups; Q1 heater switch with R41 pull-down. RETURN joins the star ground on board.
      Power terminals are in wiring-power. Connector layout pending.
    pins: [3V3, GND, GPIO1, GPIO2, GPIO3, GPIO4, RLY1, RLY2, HEAT, SW1, SW2, SW3, SW4, RETURN]
  U3:
    type: 2-ch 5V relay
    ignore_in_bom: true
    notes: Retained module; E4 open. VCC 3.3 V. IN LOW energizes the coil. Coil supply and contacts are in wiring-power.
    pins: [VCC, IN1, IN2]
  BTN:
    type: Button loom
    ignore_in_bom: true
    notes: Four switch contacts plus common return. Populate positions 1-n. Each contact closes SWn to RETURN.
    pins: [1, 2, 3, 4, 5]
    pinlabels: [SW1, SW2, SW3, SW4, RETURN]
  U6:
    type: SHT40
    ignore_in_bom: true
    notes: Adafruit 4885, I2C address 0x44, beside the camera window. 3V pad is the breakout regulator output and stays unconnected.
    pins: [VIN, 3V, GND, SCL, SDA]
    hide_disconnected_pins: false
cables:
  W17:
    category: bundle
    type: Logic loom
    gauge: 26 AWG
    colors: [OG, BK, WH, PK, YE, VT, BN, GY, RD]
    wirelabels: [3V3, GND_BTN, BUTTON1, BUTTON2, BUTTON3, BUTTON4, RELAY1, RELAY2, HEATER]
    length: 0.1
  W18:
    category: bundle
    type: Soldered or latching loom
    gauge: 26 AWG
    colors: [OG, BN, GY]
    wirelabels: [3V3_RLY, RELAY1, RELAY2]
    length: 0.2
  W19:
    category: bundle
    type: Soldered or latching loom
    gauge: 26 AWG
    colors: [WH, PK, OG, VT, BK]
    wirelabels: [SW1, SW2, SW3, SW4, RETURN]
    length: 0.3
  W20:
    category: bundle
    type: Sensor loom
    gauge: 26 AWG
    colors: [OG, BK, BU, YE]
    wirelabels: [3V3, GND_ENV, I2C_SDA, I2C_SCL]
    length: 0.25
connections:
- - J8: [1, 20, 11, 13, 15, 16, 29, 31, 18]
  - W17: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  - U5: [3V3, GND, GPIO1, GPIO2, GPIO3, GPIO4, RLY1, RLY2, HEAT]
- - J8: [17, 29, 31]
  - W18: [1, 2, 3]
  - U3: [VCC, IN1, IN2]
- - U5: [SW1, SW2, SW3, SW4, RETURN]
  - W19: [1, 2, 3, 4, 5]
  - BTN: [SW1, SW2, SW3, SW4, RETURN]
- - J8: [1, 25, 3, 5]
  - W20: [1, 2, 3, 4]
  - U6: [VIN, GND, SDA, SCL]
