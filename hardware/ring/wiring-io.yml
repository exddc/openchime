metadata:
  title: Ring buttons, relays, heater control, and sensor
  description: Direct-wired buttons, relay logic, heater switch control, and the environment sensor; four-button population
  notes: Prototype. Buttons wire straight to the GPIO header through inline 1 k series resistors at the J8 end; the Pi's internal pull-ups are enabled at boot.
    Relay coil supply and heater power are in wiring-power.
connectors:
  J8:
    type: Raspberry Pi GPIO
    subtype: male
    ignore_in_bom: true
    notes: Zero 2 W. Pin 1 is nearest the microSD slot, inner row (square pad on the underside). Pin 1 also feeds U2; see wiring-audio. R1-R4 sit inline in BUTTON1-4 within 50 mm of J8.
    pins: [1, 3, 5, 11, 13, 14, 15, 16, 17, 18, 20, 25, 29, 31]
    pinlabels: [3V3, I2C_SDA, I2C_SCL, BUTTON1, BUTTON2, GND_HSW, BUTTON3, BUTTON4, 3V3_RLY, HEATER, GND_BTN, GND_ENV, RELAY1, RELAY2]
    hide_disconnected_pins: false
  BTN:
    type: Button loom
    ignore_in_bom: true
    notes: Four IP67 anti-vandal contacts with gold contacts. Return terminals are daisy-chained at the faceplate; one return wire goes back to J8 pin 20. Populate positions 1-n.
    pins: [1, 2, 3, 4, 5]
    pinlabels: [SW1, SW2, SW3, SW4, RETURN]
  U3:
    type: 2-ch 5V relay
    ignore_in_bom: true
    notes: Retained module; E4 open. VCC 3.3 V. IN LOW energizes the coil; GPIO5 and GPIO6 are driven high from boot. Coil supply and contacts are in wiring-power.
    pins: [VCC, IN1, IN2]
  U6:
    type: SHT40
    ignore_in_bom: true
    notes: Adafruit 4885, I2C address 0x44, beside the camera window. 3V pad is the breakout regulator output and stays unconnected.
    pins: [VIN, 3V, GND, SCL, SDA]
    hide_disconnected_pins: false
  HSW1:
    type: MOSFET switch module
    ignore_in_bom: true
    notes: Bought logic-level low-side switch module with gate pull-down. SIG high turns the heater on. Power and load terminals are in wiring-power.
    pins: [SIG, GND]
cables:
  W19:
    category: bundle
    type: Soldered or latching loom
    gauge: 26 AWG
    colors: [WH, PK, OG, VT, BK]
    wirelabels: [BUTTON1, BUTTON2, BUTTON3, BUTTON4, RETURN]
    length: 0.3
  W20:
    category: bundle
    type: Soldered or latching loom
    gauge: 26 AWG
    colors: [OG, BN, GY]
    wirelabels: [3V3_RLY, RELAY1, RELAY2]
    length: 0.2
  W21:
    category: bundle
    type: Sensor loom
    gauge: 26 AWG
    colors: [OG, BK, BU, YE]
    wirelabels: [3V3, GND_ENV, I2C_SDA, I2C_SCL]
    length: 0.25
  W22:
    category: bundle
    type: Control pair
    gauge: 26 AWG
    colors: [RD, BK]
    wirelabels: [HEATER, GND_HSW]
    length: 0.15
connections:
- - J8: [11, 13, 15, 16, 20]
  - W19: [1, 2, 3, 4, 5]
  - BTN: [SW1, SW2, SW3, SW4, RETURN]
- - J8: [17, 29, 31]
  - W20: [1, 2, 3]
  - U3: [VCC, IN1, IN2]
- - J8: [1, 25, 3, 5]
  - W21: [1, 2, 3, 4]
  - U6: [VIN, GND, SDA, SCL]
- - J8: [18, 14]
  - W22: [1, 2]
  - HSW1: [SIG, GND]
