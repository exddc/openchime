metadata:
  title: Ring power and strike
  description: Mains inlet, Class II modules, 5 V distribution blocks, heater switch, strike and gate outputs; estimated lengths for the 300 x 150 mm casing
  notes: Prototype. Mains stays inside the partitioned compartment with J_AC, F0, PSU5, and PSU12. TB1 and TB2 are lever terminal blocks forming the 5 V star.
    Lengths include service slack; the supply cable, strike cable, and gate cable are excluded.
connectors:
  J_AC:
    type: Mains terminal
    subtype: 3-pole
    ignore_in_bom: true
    notes: 230 V AC from the installation. Touch-safe block inside the mains compartment; part pending enclosure design.
    pins: [L, N, PE]
  F0:
    type: Mains fuse
    subtype: T 2 A 250 V
    ignore_in_bom: true
    notes: 5 x 20 mm in a touch-protected holder, in the L conductor ahead of both modules.
    pins: [IN, OUT]
  PSU5:
    type: IRM-30-5ST
    ignore_in_bom: true
    notes: Mean Well, 5 V / 6 A, Class II, screw terminals. Sole 5 V source.
    pins: [AC/L, AC/N, +V, -V]
  PSU12:
    type: IRM-30-12ST
    ignore_in_bom: true
    notes: Mean Well, 12 V / 2.5 A, Class II, screw terminals. Strike rail, isolated from the 5 V rail.
    pins: [AC/L, AC/N, +V, -V]
  PE1:
    type: PE stud
    subtype: M4
    ignore_in_bom: true
    notes: Stud on the metal backplate. Single bonding point for the supply PE, the front plate, and the 5 V return.
    pins: [1, 2, 3]
    pinlabels: [PE_IN, PE_FRONT, PE_LV]
  FRONT:
    type: Metal front plate
    ignore_in_bom: true
    notes: Ring terminal under a serrated washer.
    pins: [1]
    pinlabels: [PE]
  TB1:
    type: 5 V block
    subtype: WAGO 221-415
    ignore_in_bom: true
    notes: One 5-pole lever connector in a 221-500 carrier. 5 V star point.
    pins: [IN, PI, AMP, RLY, HSW]
  TB2:
    type: GND block
    subtype: 2x WAGO 221-415
    ignore_in_bom: true
    notes: Two 5-pole lever connectors linked by a 50 mm 20 AWG bridge, in 221-500 carriers. 5 V return star point and PE bond.
    pins: [IN, PI, AMP, RLY, HSW, PE]
  J8:
    type: Raspberry Pi GPIO
    subtype: male
    ignore_in_bom: true
    notes: Zero 2 W. Pin 1 is nearest the microSD slot, inner row (square pad on the underside). 5 V enters on pin 2 and returns on pin 6.
    pins: [2, 6]
    pinlabels: [5V_IN, GND_IN]
    hide_disconnected_pins: false
  U1:
    type: MAX98357A
    ignore_in_bom: true
    notes: Adafruit 3006. C1 470 uF and C2 100 nF across VIN/GND. Signals and speaker are in wiring-audio.
    pins: [VIN, GND]
  F2:
    type: 500 mA hold PTC
    ignore_in_bom: true
    notes: Inline in the JD-VCC lead, insulated with heat-shrink.
    pins: [IN, OUT]
  U3:
    type: 2-ch 5V relay
    ignore_in_bom: true
    notes: Retained module; E4 open. JD-VCC jumper absent. COM1/NO1 switch the isolated 12 V strike rail. COM2/NO2 form the potential-free gate contact. Logic pins are in wiring-io.
    pins: [JD-VCC, GND, COM1, NO1, COM2, NO2]
  HSW1:
    type: MOSFET switch module
    ignore_in_bom: true
    notes: Bought logic-level low-side switch module with gate pull-down, for example AOD4184 based. DC+ passes straight to OUT+; OUT- is switched to DC-. Control pins are in wiring-io.
    pins: [DC+, DC-, OUT+, OUT-]
  HTR1:
    type: Heater pad
    ignore_in_bom: true
    pins: [+, -]
    notes: 5 V film heater, about 3 W, bonded to the camera and microphone carrier.
  F1:
    type: 1 A fuse
    ignore_in_bom: true
    notes: Fast, rated 32 V DC or more, in the 12 V+ lead to COM1.
    pins: [IN, OUT]
  JOUT1:
    type: Strike outlet
    ignore_in_bom: true
    pins: [STRIKE+, STRIKE-]
    notes: 'To the effeff 118 A7 strike. D1 1N4007 at the coil: cathode STRIKE+, anode STRIKE-. External cable length is installation-specific.'
  JOUT2:
    type: Gate outlet
    ignore_in_bom: true
    pins: [GATE_A, GATE_B]
    notes: Potential-free contact for the gate controller start input. 30 V DC / 1 A design limit.
