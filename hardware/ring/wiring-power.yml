metadata:
  title: Ring power and strike
  description: Power board U7 with the mains inlet and both Class II modules, 5 V and 12 V distribution, strike and gate outputs; estimated lengths for the 300 x 150 mm casing
  notes: Prototype; protection and insulation qualification pending. Installation cable terminates on U7 in the mains compartment; circuits in boards.md.
    Lengths include service slack; the supply cable, strike cable, and gate cable are excluded.
connectors:
  SUPPLY:
    type: Installation cable
    subtype: 3G1.5
    ignore_in_bom: true
    notes: |
      230 V AC through M20 gland. Installation length excluded;
      electrician termination.
    pins: [L, N, PE]
  U7:
    type: Ring power board
    ignore_in_bom: true
    notes: |
      Prototype; see boards.md. Mains under insulating cover. PE1
      bonds backplate; JP1 bonds 5 V return to PE. Logical terminals;
      protection qualification pending.
    pins: [L, N, PE, PE_FRONT, 5V_PI, GND_PI, 5V_AMP, GND_AMP, 5V_LED, GND_LED, JD-VCC, GND_RLY, 12V_FUSED, 12V_RTN]
    hide_disconnected_pins: false
  FRONT:
    type: Metal front plate
    ignore_in_bom: true
    notes: |
      PE bond: ring terminal and serrated washer. Front plate also
      supports switches.
    pins: [1]
    pinlabels: [PE]
  J8:
    type: Raspberry Pi GPIO
    subtype: male
    ignore_in_bom: true
    notes: |
      Zero 2 W physical pins: 5 V on 2, return on 6. Branch protection
      pending.
    pins: [2, 6]
    pinlabels: [5V_IN, GND_IN]
    hide_disconnected_pins: false
  U1:
    type: MAX98357A
    ignore_in_bom: true
    notes: |
      Adafruit 3006. C1 470 uF and C2 100 nF at VIN/GND. Signals:
      wiring-audio.
    pins: [VIN, GND]
  U5:
    type: Ring key board
    ignore_in_bom: true
    notes: |
      J52 backlight supply. Circuit: boards.md; logic: wiring-io.
    pins: [5V_LED, GND_LED]
  U3:
    type: 2-ch 5V relay
    ignore_in_bom: true
    notes: |
      E4 deferred. Remove JD-VCC jumper. Strike: COM1/NO1; dry gate
      contact: COM2/NO2. Logic: wiring-io.
    pins: [JD-VCC, GND, COM1, NO1, COM2, NO2]
  JOUT1:
    type: Strike outlet
    ignore_in_bom: true
    pins: [STRIKE+, STRIKE-]
    notes: |
      effeff 118 A7. D1 at coil: cathode STRIKE+, anode STRIKE-.
      External cable length excluded.
  JOUT2:
    type: Gate outlet
    ignore_in_bom: true
    pins: [GATE_A, GATE_B]
    notes: |
      Potential-free gate start contact; 30 V DC / 1 A design limit.
cables:
  WAC:
    category: bundle
    type: NYY-J or H07RN-F
    gauge: 1.5
    gauge_unit: mm2
    colors: [BN, BU, GNYE]
    wirelabels: [L, N, PE]
  W1:
    category: bundle
    type: H07V-K
    gauge: 1.0
    gauge_unit: mm2
    colors: [GNYE]
    wirelabels: [PE_FRONT]
    length: 0.25
  W2:
    category: bundle
    type: 20 AWG pigtail
    gauge: 20 AWG
    colors: [RD, BK]
    wirelabels: [5V_IN, GND_IN]
    length: 0.2
  W3:
    category: bundle
    type: 22 AWG pigtail
    gauge: 22 AWG
    colors: [RD, BK]
    wirelabels: [5V_AMP, GND_AMP]
    length: 0.2
  W4:
    category: bundle
    type: 22 AWG pigtail
    gauge: 22 AWG
    colors: [RD, BK]
    wirelabels: [JD-VCC, GND_RLY]
    length: 0.2
  W6:
    category: bundle
    type: 22 AWG pigtail
    gauge: 22 AWG
    colors: [RD, BK]
    wirelabels: [5V_LED, GND_LED]
    length: 0.1
  W7:
    category: bundle
    type: 22 AWG
    gauge: 22 AWG
    colors: [RD]
    wirelabels: [12V_FUSED]
    length: 0.15
  W8:
    category: bundle
    type: 22 AWG
    gauge: 22 AWG
    colors: [RD]
    wirelabels: [STRIKE+]
    length: 0.1
  W9:
    category: bundle
    type: 22 AWG
    gauge: 22 AWG
    colors: [BK]
    wirelabels: [STRIKE-]
    length: 0.15
  W10:
    category: bundle
    type: 22 AWG pigtail
    gauge: 22 AWG
    colors: [WH, WH]
    wirelabels: [GATE_A, GATE_B]
    length: 0.1
connections:
- - SUPPLY: [L, N, PE]
  - WAC: [1, 2, 3]
  - U7: [L, N, PE]
- - U7: [PE_FRONT]
  - W1: [1]
  - FRONT: [1]
- - U7: [5V_PI, GND_PI]
  - W2: [1, 2]
  - J8: [2, 6]
- - U7: [5V_AMP, GND_AMP]
  - W3: [1, 2]
  - U1: [VIN, GND]
- - U7: [JD-VCC, GND_RLY]
  - W4: [1, 2]
  - U3: [JD-VCC, GND]
- - U7: [5V_LED, GND_LED]
  - W6: [1, 2]
  - U5: [5V_LED, GND_LED]
- - U7: [12V_FUSED]
  - W7: [1]
  - U3: [COM1]
- - U3: [NO1]
  - W8: [1]
  - JOUT1: [STRIKE+]
- - U7: [12V_RTN]
  - W9: [1]
  - JOUT1: [STRIKE-]
- - U3: [COM2, NO2]
  - W10: [1, 2]
  - JOUT2: [GATE_A, GATE_B]
