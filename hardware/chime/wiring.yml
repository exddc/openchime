# Chime I2S speaker harness (Pi J8 → MAX98357A → speaker).

metadata:
  title: Chime
  description: Pi Zero 2 W J8 to MAX98357A to speaker; estimated lengths for the 110 x 110 mm housing
  notes: Soldered loom, no friction-fit housings on J8. Speaker pair twisted and routed away from the I2S leads.

connectors:
  J8:
    type: Raspberry Pi GPIO
    subtype: male
    ignore_in_bom: true
    notes: |
      Zero 2 W physical pins. Pin 1 is nearest the microSD slot,
      inner row (square pad on the underside).
    pins: [4, 6, 12, 35, 40]
    pinlabels: [5V_AMP, GND_AMP, I2S_BCLK, I2S_LRCLK, I2S_DIN]
    hide_disconnected_pins: false

  U1:
    type: MAX98357A
    ignore_in_bom: true
    notes: |
      Adafruit 3006. VIN-SD: left; GAIN open: 9 dB.
      C1 470 uF and C2 100 nF at VIN/GND. Neither SPK terminal is ground.
    pins: [VIN, GND, SD, GAIN, DIN, BCLK, LRC, SPK+, SPK-]
    hide_disconnected_pins: false

  SP1:
    type: Speaker
    ignore_in_bom: true
    notes: |
      EKULIT LSM-104F/SQ, 8 ohm / 3 W.
    pins: [SPK+, SPK-]
    pinlabels: [SPK+, SPK-]

cables:
  W1:
    category: bundle
    type: Soldered loom
    gauge: 24 AWG
    colors: [RD, BK]
    wirelabels: [5V_AMP, GND_AMP]
    length: 0.1

  W2:
    category: bundle
    type: Soldered loom
    gauge: 26 AWG
    colors: [YE, GN, BU]
    wirelabels: [I2S_BCLK, I2S_LRCLK, I2S_DIN]
    length: 0.1

  W3:
    category: bundle
    type: Twisted speaker pair
    gauge: 24 AWG
    colors: [RD, BK]
    wirelabels: [SPK+, SPK-]
    length: 0.1

  W4:
    category: bundle
    type: Local strap
    gauge: 26 AWG
    colors: [RD]
    wirelabels: [SD]
    length: 0.02

connections:
  -
    - J8: [4, 6]
    - W1: [1, 2]
    - U1: [VIN, GND]
  -
    - J8: [12, 35, 40]
    - W2: [1, 2, 3]
    - U1: [BCLK, LRC, DIN]
  -
    - U1: [SPK+, SPK-]
    - W3: [1, 2]
    - SP1: [SPK+, SPK-]
  -
    - U1: [VIN]
    - W4: [1]
    - U1: [SD]
